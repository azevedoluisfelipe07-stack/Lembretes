<style>
:root{--bg:#fafaf8;--surface:#fff;--card:#fff;--text:#1c1c1a;--muted:#8a8a85;--line:#ebebe6;--accent:#2f6df6;--accent-ink:#fff;--danger:#d64545;--fs:1;--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;--pad:14px;--mg:8px;--r:16px;--shadow:0 8px 30px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:calc(16px*var(--fs))/1.45 var(--font);-webkit-font-smoothing:antialiased;transition:background .2s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 120px}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--line);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.banner{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;animation:in .3s}
.banner span{flex:1;color:var(--muted)}
.banner button{color:var(--accent);font-weight:600;padding:6px 10px;border-radius:8px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tab{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:550;color:var(--muted);transition:.15s}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.group,.gtitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad) 14px var(--pad) 16px;margin-bottom:var(--mg);animation:in .25s;transition:border-color .15s}
.item:hover{border-color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center;transition:.15s}
.check:hover{border-color:var(--accent)}
.check svg{width:14px;height:14px;stroke:var(--accent-ink);opacity:0;transition:.15s}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.item.done .check svg{opacity:1}
.body{flex:1;min-width:0;text-align:left}
.t{font-weight:600;word-break:break-word}
.d{color:var(--muted);font-size:calc(14px*var(--fs));margin-top:2px;white-space:pre-wrap;word-break:break-word}
.when{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:calc(12.5px*var(--fs));color:var(--muted)}
.when.late{color:var(--danger)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:12px}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
.fab{position:fixed;right:max(20px,calc(50% - 290px));bottom:calc(24px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow);transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:20px;height:20px}
dialog{border:0;padding:0;background:var(--bg);max-width:none;max-height:none;width:100%;height:100%;color:var(--text);overflow:hidden}
.sheet{height:100%;overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.pagebar{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px}
.pagebar h2{margin:0;font-size:17px;font-weight:650;text-align:center}
.barbtn{color:var(--accent);font-weight:650;padding:8px 12px;border-radius:10px;justify-self:end}
.barbtn:hover{background:var(--line)}
.page{max-width:620px;margin:0 auto;padding:0 20px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:.15s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.bigin{font-size:26px;font-weight:650;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 0}
.bigin:focus{box-shadow:none;border-color:var(--accent)}
textarea{resize:none;min-height:130px}
.row{display:flex;gap:10px}.row>div{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 13px;border-radius:999px;background:var(--line);font-size:13.5px;font-weight:550}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.btn{padding:13px;border-radius:12px;font-weight:600;background:var(--line);transition:.15s}
.btn.mini{padding:9px 16px;flex:none}
.btn.danger{width:100%;color:var(--danger);margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{padding:14px 16px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.srow.flex{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sl{font-weight:550;font-size:15px;margin-bottom:10px}.srow.flex .sl{margin:0}
.sl b{color:var(--muted);font-weight:500;margin-left:6px}
.srow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:550;color:var(--muted);transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.swatches{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:2px}
.sw{margin:0;padding:0;font-size:0;font-weight:400;letter-spacing:0;text-transform:none;width:34px;height:34px;flex:none;border-radius:50%;transition:.15s;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 18%,transparent);position:relative;display:block}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.sw.custom{background:conic-gradient(#f44,#fc4,#4d4,#4cf,#74f,#f4c,#f44);overflow:hidden}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);box-shadow:none!important}
.sample{margin-top:10px;font-size:calc(16px*var(--fs));padding:10px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.switch{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.field{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;transition:.15s}
.field:hover{border-color:var(--muted)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
dialog.pick{background:transparent}
dialog.pick::backdrop{background:rgba(0,0,0,.4)}
.pwrap{height:100%;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.pwrap{align-items:center}}
.psheet{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1);color:var(--text)}
@media(min-width:640px){.psheet{border-radius:24px}}
.ptitle{font-weight:650;text-align:center;margin-bottom:12px}
.pbtns{display:flex;gap:8px;margin-top:16px}.pbtns button{flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.phead b{flex:1;text-align:center;font-size:16px}
.phead button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.phead button:hover{background:var(--line);color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal.wd span{font-size:12px;color:var(--muted);font-weight:600;padding:6px 0}
.day{aspect-ratio:1;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.day:hover{background:var(--line)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px}
.wheels .hl{position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:12px;background:var(--line)}
.wheel{position:relative;z-index:1;height:220px;width:76px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;text-align:center;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel button{display:block;width:100%;height:44px;scroll-snap-align:center;font-size:22px;font-variant-numeric:tabular-nums;color:var(--muted)}
.wheel button.on{color:var(--text);font-weight:650}
.colon{font-size:22px;font-weight:650;z-index:1}
.sv{position:relative;height:170px;border-radius:14px;touch-action:none;cursor:crosshair;margin:4px 0 14px}
.hue{position:relative;height:26px;border-radius:13px;touch-action:none;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sv i,.hue i{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.hue i{top:50%}
.hexrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.hexrow .prev{flex:none;width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 18%,transparent)}
.hexrow input{text-transform:uppercase;font-variant-numeric:tabular-nums}
#repbox .srow{border-top:1px solid var(--line)}
.rl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.rl .seg{flex:1 1 230px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:9px;font-size:20px;color:var(--muted)}
.stepper button:hover{background:var(--surface);color:var(--text)}
.stepper b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.wdays{display:flex;gap:6px;margin-bottom:8px}
.wdays button{flex:1;max-width:46px;aspect-ratio:1;border-radius:50%;background:var(--line);font-weight:650;font-size:13px;color:var(--muted);transition:.15s}
.wdays button.on{background:var(--accent);color:var(--accent-ink)}
.xs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.xchip{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px}
.xchip button{width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.xchip button:hover{background:var(--surface);color:var(--text)}
.xadd{display:flex;gap:8px;margin-bottom:6px}
.note{font-size:13px;color:var(--muted);margin:0 2px 10px}
.rp{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:2147483647;padding:0 16px}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;max-width:420px;width:100%;box-shadow:var(--shadow);animation:in .25s;display:flex;gap:10px;align-items:center}
.toast b{display:block}.toast small{opacity:.7}
.toast button{margin-left:auto;font-weight:600;color:inherit;opacity:.8;padding:4px 8px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div><h1>Lembretes</h1><div class="sub" id="sub"></div></div>
    <button class="icon-btn" id="gear" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>
  <div id="banner"></div>
  <div id="extra"></div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="open" role="tab">Pendentes</button>
    <button class="tab" data-tab="done" role="tab">Concluídos</button>
  </div>
  <main id="list"></main>
</div>
<button class="fab" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo</button>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="ndlg">
  <div class="sheet">
    <div class="pagebar">
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="dlgTitle">Novo lembrete</h2>
      <button class="barbtn" id="save">Salvar</button>
    </div>
    <div class="page">
      <input class="bigin" id="f-title" maxlength="80" placeholder="Título" autocomplete="off" aria-label="Título">
      <label for="f-desc">Descrição</label>
      <textarea id="f-desc" maxlength="400" placeholder="Detalhes (opcional)"></textarea>
      <label>Quando</label>
      <div class="row"><div><button type="button" class="field" id="b-date"></button></div><div><button type="button" class="field" id="b-time"></button></div></div>
      <input type="hidden" id="f-date"><input type="hidden" id="f-time">
      <div class="chips"><button data-d="0">Hoje</button><button data-d="1">Amanhã</button><button data-d="7">Em 1 semana</button></div>
      <div class="gtitle" style="margin-top:26px">Repetição</div>
      <p class="note" id="repinfo" hidden>Esta ocorrência faz parte de uma repetição. Alterações valem para ela e para as próximas; as anteriores continuam no histórico.</p>
      <div class="card" id="repcard">
        <div class="srow flex"><div><div class="sl">Repetir</div><small id="repnote">Cria a próxima automaticamente após cada ocorrência.</small></div><button type="button" class="switch" id="rep-on" role="switch" aria-checked="false" aria-label="Repetir"></button></div>
        <div id="repbox" hidden></div>
      </div>
      <div class="err" id="err"></div>
      <button class="btn danger" id="del" hidden>Excluir lembrete</button>
    </div>
  </div>
</dialog>

<dialog id="sdlg">
  <div class="sheet">
    <div class="pagebar">
      <button class="icon-btn" data-close aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Configurações</h2>
      <button class="barbtn" data-close>Pronto</button>
    </div>
    <div class="page" id="spage"></div>
  </div>
</dialog>

<dialog id="pdlg" class="pick"><div class="pwrap" id="pwrap"><div class="psheet" id="psheet"></div></div></dialog>

function dnOf(s){var p=s.split('-');return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)}
function strOf(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}

function wdOf(s){var p=s.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()}
function excluded(r,s){return r.skipD.indexOf(s)>=0||r.skipR.some(function(x){return s>=x[0]&&s<=x[1]})}
function isOcc(r,s){
 if(s<r.start||(r.end&&s>r.end)||excluded(r,s))return false;
 var p=s.split('-'),q=r.start.split('-'),y=+p[0],m=+p[1]-1,d=+p[2],y0=+q[0],m0=+q[1]-1,d0=+q[2],n=r.every||1,wd=wdOf(s),
  W=r.wdays&&r.wdays.length?r.wdays:(r.freq==='week'?[wdOf(r.start)]:[0,1,2,3,4,5,6]);
 if(r.freq==='day')return(dnOf(s)-dnOf(r.start))%n===0&&W.indexOf(wd)>=0;
 if(r.freq==='week')return Math.round(((dnOf(s)-wd)-(dnOf(r.start)-wdOf(r.start)))/7)%n===0&&W.indexOf(wd)>=0;
 if(r.freq==='month')return((y-y0)*12+m-m0)%n===0&&d===Math.min(d0,dim(y,m));

function firstFrom(r,from){var f=from<r.start?r.start:from;return nextOcc(r,strOf(dnOf(f)-1))}

/* Gera a próxima ocorrência quando a atual foi concluída ou já passou; nunca duplica uma data */
function ensureNext(sr){if(!sr.active||sr.ended)return false;

  var it=items.find(function(x){return x.sid===sr.id&&x.date===sr.last});
  if(it&&!(it.done||it.notified||due(it)<=now))break;
  var nd=nextOcc(sr.rule,sr.last);
  if(!nd){sr.ended=true;ch=true;break}
  sr.last=nd;ch=true;
  if(items.some(function(x){return x.sid===sr.id&&x.date===nd}))continue;
  var o={id:uid(),title:sr.title,desc:sr.desc,date:nd,time:sr.time,done:false,notified:false,sid:sr.id};
  if(due(o)<=now){o.notified=true;made.push(o)}else{items.push(o);break}}

 return{on:!!(sr&&sr.active),freq:r?r.freq:'day',every:r?r.every:1,wdays:r&&r.wdays.length?r.wdays.slice():[0,1,2,3,4,5,6],start:r?r.start:date,startAuto:!r,endOn:!!(r&&r.end),end:(r&&r.end)||'',skipD:r?r.skipD.slice():[],skipR:r?r.skipR.map(function(a){return a.slice()}):[],orig:r?JSON.stringify(r):''}}

 var n=x.every,U={day:['Dia','Dias'],week:['Semana','Semanas'],month:['Mês','Meses'],year:['Ano','Anos']},h='';

 var xs=x.skipD.map(function(s,i){return'<span class="xchip">'+fmtDay(s)+'<button data-xd="d:'+i+'" aria-label="Remover exceção">×</button></span>'}).concat(x.skipR.map(function(a,i){return'<span class="xchip">'+fmtDay(a[0])+' – '+fmtDay(a[1])+'<button data-xd="r:'+i+'" aria-label="Remover exceção">×</button></span>'}));
 h+='<div class="srow"><div class="sl">Exceções</div>'+(xs.length?'<div class="xs">'+xs.join('')+'</div>':'')+'<div class="xadd"><button class="btn mini" data-xa="d">+ Dia</button><button class="btn mini" data-xa="r">+ Período</button></div><small>Nessas datas o lembrete não é criado.</small></div>';
 var rule=ruleOf(x),ve=validRule(x),pv;
 if(ve)pv=ve;else{var base=$('#f-date').value||ymd(new Date()),f=firstFrom(rule,base>rule.start?base:rule.start),out=[];while(f&&out.length<3){out.push(fmtShort(f));f=nextOcc(rule,f)}pv=out.length?'Próximas: '+out.join(' · '):'Nenhuma data válida com essas regras.'}

function setFreq(f){if(f===rd.freq)return;rd.freq=f;var sw=new Date(rd.start+'T00:00').getDay();if(f==='week'&&rd.wdays.length===7)rd.wdays=[sw];if(f==='day'&&rd.wdays.length===1)rd.wdays=[0,1,2,3,4,5,6]}
$('#repcard').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!rd)return;var d=b.dataset;
 if(b.id==='rep-on'){rd.on=!rd.on;if(rd.on&&rd.startAuto)rd.start=$('#f-date').value;renderRep();return}
 if(!rd.on)return;
 if(d.rn)rd.every=Math.max(1,Math.min(99,rd.every+Number(d.rn)));

 else if(d.rd==='start'){pickDate(rd.start,function(v){rd.start=v;rd.startAuto=false;if(rd.endOn&&rd.end&&rd.end<v)rd.end=v;renderRep()},'Começa em');return}

 else if(d.xd){var p=d.xd.split(':');(p[0]==='d'?rd.skipD:rd.skipR).splice(Number(p[1]),1)}
 else return;
 renderRep()});
function pickEnd(){pickDate(rd.end||rd.start,function(v){rd.end=v<rd.start?rd.start:v;renderRep()},'Termina em')}

/* Seletores próprios: data, hora e cor */

var pd=$('#pdlg'),pcb=null;

 if(rd&&rd.on&&rd.startAuto&&d){rd.start=d;renderRep()}}
function openPick(html,o){$('#psheet').innerHTML=html;pcb=o;o.done=false;pd.showModal();if(o.init)o.init()}
function pickDone(v){var c=pcb;if(!c)return;c.done=true;pd.close();if(c.ok)c.ok(v)}

$('#pwrap').addEventListener('mousedown',function(e){if(e.target===this)pd.close()});
$('#psheet').addEventListener('click',function(e){if(!pcb)return;var b=e.target.closest('button');if(!b)return;

function pickDate(val,cb,title){var sel=val?new Date(val+'T00:00'):new Date(),vy=sel.getFullYear(),vm=sel.getMonth(),cur=ymd(sel);
 function draw(){var start=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate(),today=ymd(new Date()),i,d,k,
  h=(title?'<div class="ptitle">'+title+'</div>':'')+'<div class="phead"><button data-n="-12" aria-label="Ano anterior">«</button><button data-n="-1" aria-label="Mês anterior">‹</button><b>'+MESES[vm]+' '+vy+'</b><button data-n="1" aria-label="Próximo mês">›</button><button data-n="12" aria-label="Próximo ano">»</button></div><div class="cal wd">'+'DSTQQSS'.split('').map(function(x){return'<span>'+x+'</span>'}).join('')+'</div><div class="cal">';
  for(i=0;i<start;i++)h+='<i></i>';
  for(d=1;d<=days;d++){k=vy+'-'+pad(vm+1)+'-'+pad(d);h+='<button class="day'+(k===cur?' on':'')+(k===today?' today':'')+'" data-d="'+k+'">'+d+'</button>'}
  $('#psheet').innerHTML=h+'</div><div class="pbtns"><button class="btn" data-p="today">Hoje</button><button class="btn" data-p="cancel">Cancelar</button><button class="btn primary" data-p="ok">OK</button></div>'}
 openPick('',{init:draw,val:function(){return cur},ok:cb,click:function(b){
  if(b.dataset.n){var n=Number(b.dataset.n);if(Math.abs(n)===12)vy+=n/12;else{vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}}draw()}
  else if(b.dataset.d){cur=b.dataset.d;draw()}
  else if(b.dataset.p==='today'){var t=new Date();cur=ymd(t);vy=t.getFullYear();vm=t.getMonth();draw()}}})}

function pickTime(val,cb){var p=(val||'09:00').split(':'),H=+p[0],M=+p[1],h12=!S.h24,hl=[],ml=[],i;
 for(i=h12?1:0;i<=(h12?12:23);i++)hl.push(h12?String(i):pad(i));

 var start=[h12?(H%12||12)-1:H,M,H>=12?1:0];
 function wheel(n,list){return'<div class="wheel" data-w="'+n+'">'+list.map(function(x,j){return'<button data-i="'+j+'">'+x+'</button>'}).join('')+'</div>'}
 function mark(w){var i=Math.round(w.scrollTop/44);w.querySelectorAll('button').forEach(function(b,j){b.classList.toggle('on',j===i)})}
 function get(n){var w=document.querySelector('#psheet .wheel[data-w='+n+']');return w?Math.round(w.scrollTop/44):0}

  init:function(){document.querySelectorAll('#psheet .wheel').forEach(function(w,j){w.scrollTop=start[j]*44;mark(w);var t;w.addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(function(){mark(w)},60)})})},

function hex2hsv(x){var n=parseInt(x.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b),h=0;
 if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
 return[h,mx?d/mx:0,mx]}

function openColor(k){var prev=S[k],hsv=hex2hsv(pair(k)[isDark()?1:0]),h=hsv[0],s=hsv[1],v=hsv[2],live=false,hex,sv,hue,inp;

function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}

function doInstall(){if(standalone()){toast('O app já está instalado','');return}
 if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;extras()});return}

 $('#extra').innerHTML=h}
$('#extra').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.x==='install')doInstall();if(b.dataset.x==='ok'){try{localStorage.setItem(DISM,'1')}catch(x){}extras()}});

if('serviceWorker'in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;return navigator.serviceWorker.ready}).then(function(r){swReg=r}).catch(function(){})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
loadSettings();applyTheme();load();render();banner();extras();refreshInstall();check();setInterval(check,15000);
